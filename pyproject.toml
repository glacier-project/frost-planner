[project]
name = "frost_planner"
version = "0.2.4"
description = "A Python library for solving Flexible Job-Shop (FJS) scheduling problems."
readme = "README.md"
license = { text = "BSD-2-Clause" }
authors = [
    { name = "Sebastiano Gaiardelli", email = "sebastiano.gaiardelli@univr.it" },
]
requires-python = ">=3.12,<4"
dependencies = [
    "pydantic>=2.13.4,<3",
    "pandas>=3.0.3,<4",
    "matplotlib>=3.10.9,<4",
    "mplcursors>=0.6,<1",
    "rich>=15.0.0,<16",
]

[dependency-groups]
dev = [
    "radon>=6.0.1,<7",
    "lizard>=1.22.1,<2",
    "pre-commit>=4.6.0,<5",
    "mypy>=2.1.0,<3",
    "ruff>=0.15.12,<0.16",
    "tox>=4.53.1,<5",
    "pyqt5>=5.15.11,<6",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
]
docs = [
    "sphinx>=9.1.0,<10",
    "sphinx-rtd-theme>=3.1.0,<4",
    "sphinx-autoapi>=3.8.0,<4",
    "furo>=2025.12.19",
    "myst-parser>=5.0.0,<6",
    "sphinx-copybutton>=0.5.2,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frost_planner"]

[tool.mypy]
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
disable_error_code = [
    "annotation-unchecked",
    "import-not-found",
    "import-untyped",
]

[tool.ruff]
# Google style uses 80 chars
line-length = 80
target-version = "py312"

[tool.ruff.lint]
# Google Python Style Guide compliant rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "D",      # pydocstyle (docstring conventions)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # docstrings not required in tests
]

[tool.ruff.lint.pydocstyle]
# Google docstring convention
convention = "google"

[tool.ruff.lint.isort]
# Google style: absolute imports, sorted
known-first-party = ["frost_planner"]
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
